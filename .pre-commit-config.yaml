repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ESLint for the `next` frontend
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c "cd next && yarn lint:fix"
        language: system
        files: ^next/src/.*\.(js|jsx|ts|tsx)$
