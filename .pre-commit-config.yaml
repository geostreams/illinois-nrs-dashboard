repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

# eslint to check for style violations and errors in the code for frontend
-  repo: local
   hooks:
   - id: eslint
     name: eslint
     entry: bash -c "npx eslint --fix src"
     language: system
     files: src

- repo: local
  hooks:
  - id: prettier
    name: prettier
    entry: bash -c "npx prettier --write src"
    language: system
    files: src
