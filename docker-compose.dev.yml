version: "3"
services:
  strapi:
    container_name: strapi
    # image: il-nrs-strapi
    build:
      context: ./cms
      target: development
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: strapiDB
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: debug
    volumes:
      - ./cms/config:/opt/app/config
      - ./cms/src:/opt/app/src
      - ./cms/package.json:/opt/package.json
      - ./cms/.env:/opt/app/.env
      - ./cms/public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - strapi
    depends_on:
      - strapiDB

  strapiDB:
    container_name: strapiDB
    platform: linux/amd64
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data/ #using a volume
      #- ./data:/var/lib/postgresql/data/ # if you want to use a bind folder

    ports:
      - "5432:5432"
    networks:
      - strapi

  # To test the production image locally, run:
  #   docker compose -f docker-compose.dev.yml --profile prod up --build strapi-prod strapiDB
  # strapi-prod:
  #   container_name: strapi-prod
  #   profiles: ["prod"]
  #   build:
  #     context: ./cms
  #     target: production
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_CLIENT: ${DATABASE_CLIENT}
  #     DATABASE_HOST: strapiDB
  #     DATABASE_PORT: ${DATABASE_PORT}
  #     DATABASE_NAME: ${DATABASE_NAME}
  #     DATABASE_USERNAME: ${DATABASE_USERNAME}
  #     DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  #     JWT_SECRET: ${JWT_SECRET}
  #     ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
  #     APP_KEYS: ${APP_KEYS}
  #     API_TOKEN_SALT: ${API_TOKEN_SALT}
  #     TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
  #     NODE_ENV: production
  #     LOG_LEVEL: debug
  #   volumes:
  #     - ./cms/public/uploads:/opt/app/public/uploads
  #   ports:
  #     - "1337:1337"
  #   networks:
  #     - strapi
  #   depends_on:
  #     - strapiDB

  # Uncomment this for local testing of frontend image
  # frontend:
  #   image: il-nrs-frontend
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - strapi

volumes:
  strapi-data:

networks:
  strapi:
    driver: bridge
