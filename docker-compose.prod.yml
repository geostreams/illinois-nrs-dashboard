version: "3"
services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - "--log.level=DEBUG"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--api=true"
      - "--api.dashboard=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Optional: Use staging server during testing
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
    ports:
      # The HTTP port
      - "80:80"
      - "443:443"
    networks:
      - ilnrs
    volumes:
    # So that Traefik can listen to the Docker events
    - /var/run/docker.sock:/var/run/docker.sock
    - ${LETSENCRYPT_DIR}/acme.json:/acme.json:rw


  strapi:
    container_name: strapi
    image: hub.ncsa.illinois.edu/il-nrs/strapi:main
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: strapiDB
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      APP_KEYS: ${APP_KEYS}
      NODE_ENV: ${STRAPI_NODE_ENV}
      LOG_LEVEL: debug
    volumes:
    #   - ./cms/config:/opt/app/config
    #   - ./cms/src:/opt/app/src
    #   - ./cms/package.json:/opt/package.json
      - ./cms/public:/opt/app/public
    networks:
      - ilnrs
    depends_on:
      - strapiDB
    labels:
      - traefik.enable=true
      - traefik.http.routers.strapi.entrypoints=websecure
      - traefik.http.routers.strapi.rule=Host(`strapi.${SITE_URL}`) && PathPrefix(`/`)
      - traefik.http.services.strapi.loadbalancer.server.port=1337
      - traefik.http.routers.strapi.tls=true
      - traefik.http.routers.strapi.tls.certresolver=letsencrypt


  strapiDB:
    container_name: strapiDB
    platform: linux/amd64
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - strapi-data:/var/lib/postgresql/data/ #using a volume
      #- ./data:/var/lib/postgresql/data/ # if you want to use a bind folder
    networks:
      - ilnrs
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: hub.ncsa.illinois.edu/il-nrs/frontend:main
    depends_on:
      - strapi
    networks:
      - ilnrs
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.rule=Host(`${SITE_URL}`) && PathPrefix(`/`)
      - traefik.http.services.frontend.loadbalancer.server.port=3000
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt

volumes:
  strapi-data:

networks:
  ilnrs:
