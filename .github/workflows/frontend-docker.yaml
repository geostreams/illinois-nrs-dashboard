name: frontend-docker

# Trigger on pull request
on:
    workflow_dispatch:
    push:
        branches:
            - main
        tags:
            - v*
        paths:
            - 'next/**'
    pull_request:
        branches:
            - main
        paths:
            - 'next/**'



env:
    PLATFORM: "linux/amd64"
    REGISTRY: "hub.ncsa.illinois.edu"


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
        -
            name: Checkout repository
            uses: actions/checkout@v4

        -
            name: Docker metadata
            id: meta
            uses: docker/metadata-action@v5
            with:
                images: ${{ env.REGISTRY }}/il-nrs/frontend

        # Show the metadata used for the image
        -
            name: Print metadata
            run: |
                echo "REGISTRY: ${{ env.REGISTRY }}"
                echo "PLATFORM: ${{ env.PLATFORM }}"
                echo "IMAGE: ${{ env.REGISTRY }}/il-nrs/frontend"

        # Show the metadata used for the image in the next step

        -
            name: Login to the NCSA HUB registry
            uses: docker/login-action@v3
            with:
                registry: ${{ env.REGISTRY }}
                username: ${{ secrets.NCSA_HUB_USERNAME }}
                password: ${{ secrets.NCSA_HUB_PASSWORD }}

        -
            name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
            with:
                platforms: ${{ env.PLATFORM }}

        -
            name: Build and push Docker image
            uses: docker/build-push-action@v6
            with:
                context: next/.
                platforms: ${{ env.PLATFORM }}
                push: true
                tags: ${{ steps.meta.outputs.tags }}
